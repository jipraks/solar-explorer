<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Jelajah Tata Surya · Explore the Solar System</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tata Surya">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Simulasi tata surya 3D interaktif untuk anak — jelajahi, dengarkan, dan terbangkan pesawatmu sendiri.">
<style>
  :root{
    --bg:#05060f;
    --ink:#eef2ff;
    --muted:#9aa6c7;
    --line:rgba(160,180,255,.16);
    --glass:rgba(14,18,38,.72);
    --glass2:rgba(20,26,52,.86);
    --accent:#7cc4ff;
    --accent2:#ffd479;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --hud-h:104px;               /* height of the bottom control card, re-measured by app.js */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overscroll-behavior:none;touch-action:none}
  canvas{display:block;touch-action:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

  /* ---------- Loader ---------- */
  #loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,#131a35 0%,#05060f 70%);transition:opacity .7s ease,visibility .7s}
  #loader.done{opacity:0;visibility:hidden}
  .orbit-spin{width:96px;height:96px;border-radius:50%;border:1px solid rgba(124,196,255,.25);position:relative;animation:spin 3.4s linear infinite}
  .orbit-spin::after{content:"";position:absolute;top:-5px;left:calc(50% - 5px);width:10px;height:10px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 16px 4px rgba(124,196,255,.75)}
  .orbit-core{position:absolute;inset:0;margin:auto;width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff3c4,#ffb443 55%,#ff7a18);box-shadow:0 0 34px 8px rgba(255,160,60,.5)}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loadTxt{margin-top:26px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  #barWrap{margin-top:14px;width:190px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
  #bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}

  /* ---------- Top bar ---------- */
  #top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:10px;
    padding:calc(10px + var(--safe-t)) 12px 10px;
    background:linear-gradient(180deg,rgba(5,6,15,.85),rgba(5,6,15,0));pointer-events:none}
  #top>*{pointer-events:auto}
  #brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
  #brand b{font-size:15px;font-weight:650;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #brand span{font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  .pill{display:flex;align-items:center;gap:2px;background:var(--glass);border:1px solid var(--line);
    border-radius:999px;padding:3px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .pill button{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);transition:.2s}
  .pill button.on{background:rgba(124,196,255,.18);color:var(--accent)}
  .iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--glass);
    border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:.2s}
  .iconbtn:active{transform:scale(.94)}
  .iconbtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .iconbtn.on{background:rgba(124,196,255,.2);border-color:rgba(124,196,255,.45)}
  .iconbtn.on svg{stroke:var(--accent)}
  .iconbtn.hide{display:none}
  #installBtn{border-color:rgba(255,212,121,.45);background:rgba(255,212,121,.16)}
  #installBtn svg{stroke:var(--accent2)}

  /* ---------- Planet nav ---------- */
  /* 12px = #hud offset from the bottom, 8px = gap between the chips and the card */
  #nav{position:fixed;z-index:28;left:0;right:0;bottom:calc(var(--hud-h) + 20px + var(--safe-b));
    display:flex;gap:7px;padding:6px 12px;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
  #nav::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 13px 6px 7px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line);font-size:12.5px;font-weight:550;white-space:nowrap;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:.2s}
  .chip:active{transform:scale(.95)}
  .chip.on{border-color:rgba(124,196,255,.55);background:rgba(124,196,255,.16)}
  .dot{width:15px;height:15px;border-radius:50%;box-shadow:inset -3px -3px 6px rgba(0,0,0,.55)}

  /* ---------- Bottom HUD ---------- */
  #hud{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(12px + var(--safe-b));
    background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:10px 14px 12px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .hudrow{display:flex;align-items:center;gap:10px}
  #playBtn{width:36px;height:36px;flex:0 0 auto;border-radius:11px;background:rgba(124,196,255,.16);
    border:1px solid rgba(124,196,255,.35);display:grid;place-items:center}
  #playBtn svg{width:16px;height:16px;fill:var(--accent);stroke:none}
  .slwrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .sllab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .sllab i{font-style:normal;color:var(--accent2);font-weight:600;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--accent) var(--p,30%),rgba(255,255,255,.14) var(--p,30%))}
  input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.14)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;margin-top:-6px;box-shadow:0 0 0 4px rgba(124,196,255,.22)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
  #toggles{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none}
  #toggles::-webkit-scrollbar{display:none}
  .tg{flex:0 0 auto;padding:5px 11px;border-radius:9px;border:1px solid var(--line);font-size:11.5px;
    color:var(--muted);background:rgba(255,255,255,.03);transition:.2s;white-space:nowrap}
  .tg.on{color:var(--accent);border-color:rgba(124,196,255,.45);background:rgba(124,196,255,.13)}

  /* ---------- Labels ---------- */
  #labels{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
  .lab{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.05em;color:rgba(230,238,255,.9);
    text-shadow:0 1px 8px rgba(0,0,0,.95);white-space:nowrap;padding:2px 7px;border-radius:999px;
    background:rgba(8,10,24,.4);border:1px solid rgba(255,255,255,.08);will-change:transform,opacity}
  .lab.moon{font-size:9.5px;color:rgba(200,212,240,.72);background:transparent;border:0;padding:0}

  /* ---------- Info panel ---------- */
  #panel{position:fixed;z-index:40;right:0;top:0;bottom:0;width:392px;max-width:100vw;
    background:var(--glass2);border-left:1px solid var(--line);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    transform:translateX(102%);transition:transform .42s cubic-bezier(.22,1,.36,1);
    display:flex;flex-direction:column;box-shadow:-14px 0 50px rgba(0,0,0,.55)}
  #panel.open{transform:none}
  #phead{position:relative;padding:calc(18px + var(--safe-t)) 20px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
  #pclose{position:absolute;top:calc(14px + var(--safe-t));right:14px;width:34px;height:34px;border-radius:11px;
    background:rgba(255,255,255,.07);display:grid;place-items:center}
  #pclose svg{width:16px;height:16px;stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linecap:round}
  #ptype{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
  #pname{font-size:29px;font-weight:680;margin:4px 0 2px;letter-spacing:-.01em}
  #palt{font-size:12.5px;color:var(--muted)}

  /* ---------- Read-aloud narration ---------- */
  #listenBtn{display:none;align-items:center;gap:8px;margin-top:12px;padding:8px 15px 8px 11px;border-radius:999px;
    border:1px solid rgba(124,196,255,.4);background:rgba(124,196,255,.15);color:var(--accent);
    font-size:12.5px;font-weight:640;letter-spacing:.02em;transition:.2s}
  #listenBtn.show{display:inline-flex}
  #listenBtn:active{transform:scale(.96)}
  #listenBtn svg{width:17px;height:17px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #listenBtn.on{background:rgba(255,212,121,.16);border-color:rgba(255,212,121,.48);color:var(--accent2)}
  #listenBtn.on svg{fill:currentColor;stroke:none}
  #listenBtn .wv{animation:wv 1.15s ease-in-out infinite}
  #listenBtn .wv:last-child{animation-delay:.18s}
  @keyframes wv{0%,100%{opacity:.3}50%{opacity:1}}
  #voiceNote{display:none;margin-top:9px;font-size:11px;line-height:1.5;color:#8b97b8}
  #voiceNote.show{display:block}
  /* the block currently being spoken */
  .speaking{background:rgba(255,212,121,.13);box-shadow:0 0 0 1px rgba(255,212,121,.26);
    border-radius:10px;padding:7px 10px;margin-left:-10px;margin-right:-10px}
  #pbody p.speaking{margin-bottom:7px}
  .sechead.speaking{margin-top:15px}
  @media (prefers-reduced-motion:reduce){
    #listenBtn .wv{animation:none;opacity:1}
  }
  #pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 20px calc(30px + var(--safe-b));
    touch-action:pan-y;-webkit-overflow-scrolling:touch}
  #pbody p{margin:0 0 14px;font-size:14.5px;line-height:1.62;color:#dde4f7}
  .sechead{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    margin:22px 0 10px;font-weight:600}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
  .stat b{display:block;font-size:14.5px;font-weight:620;font-variant-numeric:tabular-nums}
  .stat span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.03em}
  .fact{display:flex;gap:10px;margin-bottom:11px;font-size:13.5px;line-height:1.55;color:#d5ddf2}
  .fact i{flex:0 0 auto;font-style:normal;font-size:15px;line-height:1.35}
  #deepBtn{width:100%;margin-top:6px;padding:11px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.045);font-size:12.5px;color:var(--accent);font-weight:600;letter-spacing:.03em}
  #deep{display:none;margin-top:14px}
  #deep.show{display:block}
  #deep p{font-size:13.5px;color:#c6d0e8}
  #gotoBtn{width:100%;margin-top:16px;padding:12px;border-radius:12px;border:1px solid rgba(124,196,255,.4);
    background:rgba(124,196,255,.15);font-size:13px;color:var(--accent);font-weight:650;letter-spacing:.03em}
  .cmp{margin-top:10px}
  .cmpbar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;margin:5px 0 3px}
  .cmpbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .cmplab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}

  /* ---------- Pilot mode cockpit ---------- */
  #cockpit{position:fixed;inset:0;z-index:29;display:none;pointer-events:none;
    font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
  #cockpit.open{display:block}
  #cockpit>*{pointer-events:auto}
  /* ---- the cabin ----
     A real interior rather than a border: a lit ceiling beam, two side pillars
     carrying instrument banks, a dashboard, and mullions splitting the glass
     into three panes. The frame sizes live in variables so the window, the
     media queries and the tests all agree on one set of numbers. */
  #cockpit{--ckTop:56px;--ckSide:96px;--ckBot:176px;
    --hull:#0b1020;--metal:#141b30;--metal2:#1c2540;--edge:rgba(150,200,255,.22);
    --vig:rgba(4,7,18,.8);--rim:rgba(150,200,255,.34);--lit:#5ec8ff}
  #cockpit.wreck{--hull:#170a0e;--metal:#2a1218;--metal2:#3a1a20;--edge:rgba(255,150,140,.24);
    --vig:rgba(122,14,14,.7);--rim:rgba(255,150,140,.36);--lit:#ff6a5a}
  #cockpit #ckFrame,#cockpit #ckGlass,#cockpit #ckSheen,#cockpit #ckCeil,#cockpit #ckDash,
  #cockpit .ckPillar,#cockpit .ckMul{pointer-events:none}

  #ckFrame{position:absolute;inset:0}
  /* the window: everything outside it is hull, painted by one huge shadow */
  #ckGlass{position:absolute;top:var(--ckTop);left:var(--ckSide);right:var(--ckSide);bottom:var(--ckBot);
    border-radius:26px;transition:box-shadow .35s ease;
    box-shadow:
      0 0 0 1px var(--rim),
      0 0 0 5px var(--metal),
      0 0 0 6px var(--edge),
      0 0 0 9999px var(--hull),
      inset 0 0 120px 34px var(--vig),
      inset 0 40px 56px -30px rgba(0,0,0,.85)}
  #ckSheen{position:absolute;top:var(--ckTop);left:var(--ckSide);right:var(--ckSide);bottom:var(--ckBot);
    border-radius:26px;
    background:linear-gradient(116deg,rgba(190,220,255,.06) 0%,rgba(190,220,255,0) 32%,
      rgba(190,220,255,0) 64%,rgba(160,205,255,.035) 100%)}

  /* mullions: slightly wider at the foot, which reads as perspective */
  #cockpit .ckMul{position:absolute;top:var(--ckTop);bottom:var(--ckBot);width:26px;
    background:linear-gradient(90deg,rgba(11,16,32,0),var(--metal) 22%,var(--metal2) 50%,var(--metal) 78%,rgba(11,16,32,0));
    clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}
  #cockpit .ckMul::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent,rgba(160,205,255,.16) 30%,rgba(160,205,255,.16) 70%,transparent);
    clip-path:polygon(46% 0,54% 0,58% 100%,42% 100%)}
  #cockpit .ckMul.l{left:calc(var(--ckSide) + 21%)}
  #cockpit .ckMul.r{right:calc(var(--ckSide) + 21%)}

  /* ceiling beam */
  #ckCeil{position:absolute;left:0;right:0;top:0;height:var(--ckTop);
    background:linear-gradient(180deg,#080c18,var(--metal) 55%,#0a0f1e);
    border-bottom:1px solid var(--edge);
    box-shadow:inset 0 -14px 26px -14px rgba(0,0,0,.9)}
  #ckCeil::after{content:"";position:absolute;left:12%;right:12%;bottom:7px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--lit),transparent);opacity:.5;
    box-shadow:0 0 14px 2px var(--lit)}

  /* side pillars, angled so the cabin feels like it wraps around you */
  #cockpit .ckPillar{position:absolute;top:0;bottom:0;width:var(--ckSide);
    background:linear-gradient(90deg,#070b16,var(--metal) 46%,var(--metal2) 84%,#0a0f1e);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #cockpit .ckPillar.l{left:0;clip-path:polygon(0 0,100% 0,86% 100%,0 100%)}
  #cockpit .ckPillar.r{right:0;background:linear-gradient(270deg,#070b16,var(--metal) 46%,var(--metal2) 84%,#0a0f1e);
    clip-path:polygon(0 0,100% 0,100% 100%,14% 100%)}
  #cockpit .ckPillar::before{content:"";position:absolute;top:8%;bottom:8%;width:2px;border-radius:2px;
    background:linear-gradient(180deg,transparent,var(--lit),transparent);opacity:.4;
    box-shadow:0 0 12px 1px var(--lit)}
  #cockpit .ckPillar.l::before{right:9px} #cockpit .ckPillar.r::before{left:9px}
  /* a vent grille, so the pillar is not just a bank floating in the dark */
  #cockpit .ckPillar::after{content:"";position:absolute;left:16px;right:16px;height:38px;top:12%;
    background:repeating-linear-gradient(180deg,rgba(150,200,255,.11) 0 2px,transparent 2px 6px);
    border-radius:3px;box-shadow:inset 0 0 0 1px rgba(150,200,255,.09)}

  /* dashboard */
  #ckDash{position:absolute;left:0;right:0;bottom:0;height:var(--ckBot);
    background:linear-gradient(180deg,var(--metal2) 0%,var(--metal) 22%,#090d1a 70%,#05070f 100%);
    border-top:1px solid var(--edge);
    box-shadow:0 -22px 46px rgba(0,0,0,.6),inset 0 22px 30px -22px rgba(160,205,255,.16);
    display:flex;align-items:flex-start;justify-content:center;gap:26px;padding:14px 210px 0}
  #ckDash::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--lit),transparent);opacity:.32}

  /* instrument pieces, filled in by app.js so the markup stays readable */
  #cockpit .ckBank{display:grid;gap:5px;align-content:start}
  #cockpit .ckPillar .ckBank{grid-template-columns:repeat(3,1fr);width:62px}
  #cockpit #ckDash .ckBank{grid-template-columns:repeat(6,1fr)}
  #cockpit .key{height:11px;border-radius:3px;background:linear-gradient(180deg,#28324f,#131a2e);
    box-shadow:inset 0 1px 0 rgba(180,215,255,.22),0 1px 2px rgba(0,0,0,.6)}
  #cockpit .led{height:9px;width:9px;border-radius:50%;justify-self:center;background:currentColor;
    box-shadow:0 0 8px 1px currentColor;animation:ledBlink 4s steps(1,end) infinite}
  #cockpit .sw{height:15px;border-radius:3px;background:linear-gradient(180deg,#0e1424,#1b2440);
    box-shadow:inset 0 0 0 1px rgba(150,200,255,.16);position:relative}
  #cockpit .sw::after{content:"";position:absolute;left:2px;right:2px;top:2px;height:5px;border-radius:2px;
    background:linear-gradient(180deg,#8fb6e8,#4d6da3)}
  #cockpit .sw.dn::after{top:auto;bottom:2px}
  @keyframes ledBlink{0%,72%{opacity:1}73%,100%{opacity:.18}}
  #cockpit .scr{width:104px;height:66px;border-radius:7px;position:relative;overflow:hidden;flex:0 0 auto;
    background:linear-gradient(180deg,rgba(30,60,100,.85),rgba(10,20,40,.9));
    box-shadow:inset 0 0 0 1px rgba(150,200,255,.28),inset 0 0 22px rgba(94,200,255,.22)}
  #cockpit .scr::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(180deg,rgba(94,200,255,.16) 0 1px,transparent 1px 5px)}
  #cockpit .scr::after{content:"";position:absolute;left:8px;right:8px;bottom:9px;height:22px;
    background:linear-gradient(90deg,var(--lit) 0 8px,transparent 8px 14px,var(--lit) 14px 20px,
      transparent 20px 30px,var(--lit) 30px 44px,transparent 44px 52px,var(--lit) 52px 60px,
      transparent 60px 72px,var(--lit) 72px 88px);
    opacity:.45;mask-image:linear-gradient(180deg,transparent,#000)}

  #ckCross{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none;
    border:1px solid rgba(124,196,255,.34);border-radius:50%}
  #ckCross::before,#ckCross::after{content:"";position:absolute;background:rgba(124,196,255,.5)}
  #ckCross::before{left:50%;top:-10px;width:1px;height:9px;margin-left:-.5px}
  #ckCross::after{left:50%;bottom:-10px;width:1px;height:9px;margin-left:-.5px}
  #ckDot{position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;
    background:var(--accent2);box-shadow:0 0 7px 1px rgba(255,212,121,.7)}

  .ckPanel{position:absolute;background:rgba(8,12,28,.6);border:1px solid rgba(124,196,255,.22);
    border-radius:13px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:9px 13px}
  .ckLab{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
  .ckBig{font-size:19px;font-weight:660;color:var(--accent2);line-height:1.15}
  .ckSub{font-size:10.5px;color:var(--muted);margin-top:1px}

  #ckSpeed{left:14px;top:calc(12px + var(--safe-t));min-width:132px}
  #ckTarget{right:14px;top:calc(12px + var(--safe-t));min-width:132px;text-align:right}
  #ckTarget .ckBig{color:var(--accent)}

  /* steering stick, bottom left */
  #stickPad{position:absolute;left:18px;bottom:calc(22px + var(--safe-b));width:118px;height:118px;border-radius:50%;
    background:radial-gradient(circle,rgba(20,28,56,.62),rgba(8,12,28,.5));
    border:1px solid rgba(124,196,255,.24);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    touch-action:none}
  #stickPad::before,#stickPad::after{content:"";position:absolute;background:rgba(124,196,255,.13)}
  #stickPad::before{left:12%;right:12%;top:50%;height:1px}
  #stickPad::after{top:12%;bottom:12%;left:50%;width:1px}
  #stickKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:radial-gradient(circle at 36% 32%,rgba(150,205,255,.95),rgba(70,120,190,.85));
    box-shadow:0 4px 14px rgba(0,0,0,.5);transition:transform .12s ease-out}
  #stickPad.grab #stickKnob{transition:none}

  /* thrust lever, bottom right */
  #thrWrap{position:absolute;right:18px;bottom:calc(22px + var(--safe-b));width:76px;
    display:flex;flex-direction:column;align-items:center;gap:7px}
  #thrBar{position:relative;width:56px;height:158px;border-radius:15px;overflow:hidden;
    background:rgba(8,12,28,.58);border:1px solid rgba(124,196,255,.24);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);touch-action:none}
  #thrFill{position:absolute;left:0;right:0;bottom:0;height:0%;
    background:linear-gradient(0deg,rgba(124,196,255,.5),rgba(255,212,121,.72));transition:height .06s linear}
  #thrGrip{position:absolute;left:4px;right:4px;height:12px;border-radius:6px;background:rgba(240,246,255,.92);
    box-shadow:0 2px 8px rgba(0,0,0,.55);bottom:0;transition:bottom .06s linear;pointer-events:none}
  #thrVal{font-size:15px;font-weight:660;color:var(--accent2)}
  #thrLab{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}

  /* buttons row, bottom centre */
  #ckBtns{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(26px + var(--safe-b));
    display:flex;gap:8px;align-items:center}
  .ckb{padding:9px 15px;border-radius:12px;font-size:12px;font-weight:620;letter-spacing:.04em;
    background:rgba(8,12,28,.66);border:1px solid rgba(124,196,255,.28);color:var(--ink);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap}
  .ckb:active{transform:scale(.95)}
  .ckb.hide{display:none}
  #ckVoice,#ckEngine,#ckFs{width:42px;padding:9px 0;display:grid;place-items:center}
  #ckVoice svg,#ckEngine svg,#ckFs svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #ckVoice.on,#ckEngine.on,#ckFs.on{border-color:rgba(124,196,255,.5);background:rgba(124,196,255,.16)}
  #ckVoice.on svg,#ckEngine.on svg,#ckFs.on svg{stroke:var(--accent)}
  #ckData{border-color:rgba(255,212,121,.55);background:rgba(255,212,121,.18);color:var(--accent2)}
  #ckExit{border-color:rgba(255,255,255,.18)}

  #ckWarn{position:absolute;left:50%;top:50%;transform:translate(-50%,-118px);opacity:0;transition:opacity .2s;
    padding:7px 16px;border-radius:999px;font-size:12px;font-weight:660;letter-spacing:.06em;text-transform:uppercase;
    color:#ffd0d0;background:rgba(120,20,28,.6);border:1px solid rgba(255,120,120,.5);
    backdrop-filter:blur(10px);white-space:nowrap;pointer-events:none}
  #ckWarn.on{opacity:1;animation:warnPulse .8s ease-in-out infinite}
  @keyframes warnPulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* impact: a full-screen flash, then a red canopy while the wreck spins */
  #ckFlash{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 50%,rgba(255,247,220,.96),rgba(255,140,44,.6) 42%,rgba(255,60,20,0) 74%)}
  #ckFlash.on{opacity:1}
  #ckWreck{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .25s;
    font-size:27px;font-weight:720;letter-spacing:.14em;text-transform:uppercase;color:#ffc2bd;
    text-shadow:0 2px 24px rgba(255,70,45,.75);pointer-events:none;white-space:nowrap}
  #ckWreck.on{opacity:1}
  #cockpit.wreck #ckCross,#cockpit.wreck #ckDot{opacity:0}

  #ckHint{position:absolute;left:50%;transform:translateX(-50%);top:calc(78px + var(--safe-t));
    font-size:11px;color:var(--muted);background:rgba(8,12,28,.6);border:1px solid rgba(124,196,255,.18);
    padding:6px 14px;border-radius:999px;backdrop-filter:blur(12px);text-align:center;max-width:88vw;
    transition:opacity .6s;pointer-events:none}
  #ckHint.hide{opacity:0}

  @media (max-width:640px){
    #stickPad{width:104px;height:104px;left:14px}
    #stickKnob{width:42px;height:42px;margin:-21px 0 0 -21px}
    #thrWrap{right:14px;width:66px}
    #thrBar{width:50px;height:134px}
    #ckSpeed,#ckTarget{min-width:106px;padding:7px 11px}
    .ckBig{font-size:16.5px}
    #ckWreck{font-size:21px}
    /* a phone has no screen to spare: a slimmer cabin, fewer instruments */
    #cockpit{--ckTop:30px;--ckSide:34px;--ckBot:104px}
    #ckGlass{border-radius:16px;box-shadow:
      0 0 0 1px var(--rim),
      0 0 0 4px var(--metal),
      0 0 0 5px var(--edge),
      0 0 0 9999px var(--hull),
      inset 0 0 90px 26px var(--vig),
      inset 0 30px 42px -24px rgba(0,0,0,.9)}
    #ckSheen{border-radius:16px}
    /* the pillars are too narrow here to carry instruments, and splitting a
       phone-sized window into three panes throws away most of the view */
    #cockpit .ckMul{display:none}
    #cockpit .ckPillar .ckBank{display:none}
    #cockpit .ckPillar::after{left:8px;right:8px;height:26px}
    #ckDash{padding:8px 120px 0;gap:12px}
    #cockpit #ckDash .ckBank{grid-template-columns:repeat(4,1fr);gap:4px}
    #cockpit #ckDash .ckBank>*:nth-child(n+9){display:none}
    #cockpit .scr{width:62px;height:44px}
    #cockpit #ckDash .scr+.scr{display:none}
    /* the top bar carries six buttons now — tighten it so nothing wraps */
    #top{gap:6px;padding-left:10px;padding-right:10px}
    .iconbtn{width:34px;height:34px;border-radius:10px}
    .iconbtn svg{width:17px;height:17px}
    .pill button{padding:6px 9px;font-size:12px}
    /* the button row grows when "open data" appears; at the bottom it would
       then reach under the steering stick, so on a phone it lives up top */
    #ckBtns{top:calc(86px + var(--safe-t));bottom:auto;gap:6px}
    #ckHint{top:calc(136px + var(--safe-t))}
    .ckb{padding:8px 12px;font-size:11.5px}
  }
  @media (prefers-reduced-motion:reduce){
    #ckWarn.on{animation:none;opacity:1}
  }

  /* ---------- Tooltip / hint ---------- */
  #tip{position:fixed;z-index:35;pointer-events:none;padding:5px 10px;border-radius:9px;font-size:12px;
    background:rgba(8,10,24,.9);border:1px solid var(--line);transform:translate(-50%,-155%);opacity:0;transition:opacity .15s;white-space:nowrap}
  #tip.on{opacity:1}
  #hint{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(76px + var(--safe-t));
    font-size:11.5px;color:var(--muted);background:var(--glass);border:1px solid var(--line);
    padding:6px 14px;border-radius:999px;backdrop-filter:blur(14px);transition:opacity .5s;pointer-events:none;text-align:center}
  #hint.hide{opacity:0}

  /* ---------- Help & credits sheets ---------- */
  #help,#credits{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(3,4,12,.72);backdrop-filter:blur(8px)}
  #help.open,#credits.open{display:flex}
  #helpCard,#creditsCard{width:100%;max-width:420px;max-height:82vh;overflow-y:auto;background:var(--glass2);
    border:1px solid var(--line);border-radius:20px;padding:22px;overscroll-behavior:contain;touch-action:pan-y}
  #helpCard h3,#creditsCard h3{margin:0 0 4px;font-size:19px}
  #helpCard .sub,#creditsCard .sub{font-size:12px;color:var(--muted);margin-bottom:16px}
  .hrow{display:flex;gap:12px;margin-bottom:13px;font-size:13.5px;line-height:1.5}
  .hrow i{flex:0 0 26px;font-style:normal;font-size:17px;text-align:center}
  .hrow b{display:block;font-weight:600;font-size:13.5px}
  .hrow span{color:var(--muted);font-size:12.5px}
  .crow{margin-bottom:16px}
  .crow span{display:block;margin-bottom:5px}
  .crow a{display:block;width:fit-content;max-width:100%;margin-top:3px;font-size:12px;color:var(--accent);
    text-decoration:none;border-bottom:1px solid rgba(124,196,255,.35);padding-bottom:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow a:hover{border-bottom-color:var(--accent)}
  #crNote{margin:4px 0 14px;font-size:11.5px;line-height:1.55;color:#8b97b8;
    border-top:1px solid var(--line);padding-top:14px}
  #helpClose,#creditsClose{width:100%;margin-top:8px;padding:12px;border-radius:12px;background:rgba(124,196,255,.16);
    border:1px solid rgba(124,196,255,.36);color:var(--accent);font-weight:650;font-size:13px}

  /* ---------- Language gate (first-launch language choice) ---------- */
  #langGate{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:22px;
    background:radial-gradient(circle at 50% 40%,rgba(19,26,53,.96),rgba(5,6,15,.985))}
  #langGate.open{display:flex}
  #langCard{width:100%;max-width:376px;max-height:88vh;overflow-y:auto;text-align:center;
    background:var(--glass2);border:1px solid var(--line);overscroll-behavior:contain;touch-action:pan-y;
    border-radius:22px;padding:26px 20px 20px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
  #langCard .lgIco{font-size:34px;line-height:1}
  #langCard h3{margin:12px 0 6px;font-size:18.5px;font-weight:660}
  #langCard p{margin:0 0 18px;font-size:11.5px;color:var(--muted);line-height:1.6}
  .lgBtn{width:100%;margin-top:9px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
    background:rgba(255,255,255,.045);display:flex;align-items:center;gap:12px;text-align:left;transition:.2s}
  .lgBtn:hover{border-color:rgba(124,196,255,.45);background:rgba(124,196,255,.12)}
  .lgBtn:active{transform:scale(.98)}
  .lgBtn i{flex:0 0 auto;font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--accent);
    background:rgba(124,196,255,.16);border:1px solid rgba(124,196,255,.34);border-radius:9px;padding:6px 9px}
  .lgBtn b{display:block;font-size:14.5px;font-weight:620}
  .lgBtn em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:1px}

  @media (max-width:640px){
    #panel{left:0;right:0;top:auto;bottom:0;width:100%;height:62vh;border-left:0;border-top:1px solid var(--line);
      border-radius:22px 22px 0 0;transform:translateY(102%);box-shadow:0 -14px 50px rgba(0,0,0,.6)}
    #panel.open{transform:none}
    #phead{padding:20px 18px 14px}
    #phead::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
      width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.2)}
    #pclose{top:14px;right:12px}
    #pname{font-size:25px}
    #pbody{padding:16px 18px calc(24px + var(--safe-b))}
    #brand b{font-size:13.5px}
    #brand span{display:none}
  }
  @media (min-width:641px){
    #panel.open ~ #nav,#panel.open ~ #hud{padding-right:0}
  }
</style>
</head>
<body>

<div id="loader">
  <div class="orbit-spin"><div class="orbit-core"></div></div>
  <div id="loadTxt">Memuat tata surya…</div>
  <div id="barWrap"><div id="bar"></div></div>
</div>

<div id="labels"></div>
<div id="tip"></div>
<div id="hint"></div>

<div id="top">
  <div id="brand"><b data-t="title">Jelajah Tata Surya</b><span data-t="sub">Museum Antariksa Interaktif</span></div>
  <div class="pill">
    <button id="langID" class="on">ID</button>
    <button id="langEN">EN</button>
  </div>
  <button class="iconbtn hide" id="installBtn" aria-label="install">
    <svg viewBox="0 0 24 24"><path d="M12 3.5v10.5"/><path d="M8.2 10.3L12 14.1l3.8-3.8"/><path d="M4.5 16.5v2.2a1.8 1.8 0 001.8 1.8h11.4a1.8 1.8 0 001.8-1.8v-2.2"/></svg>
  </button>
  <button class="iconbtn" id="fsBtn" aria-label="fullscreen">
    <svg viewBox="0 0 24 24"><path id="fsIco" d="M4 9V4.5h4.6M20 9V4.5h-4.6M4 15v4.5h4.6M20 15v4.5h-4.6"/></svg>
  </button>
  <button class="iconbtn" id="pilotBtn" aria-label="pilot">
    <svg viewBox="0 0 24 24"><path d="M12 2.6c2.6 2.2 4 5.4 4 9v4.2l2.1 2.3v1.5l-3.4-1.3H9.3L5.9 19.6v-1.5L8 15.8V11.6c0-3.6 1.4-6.8 4-9z"/><circle cx="12" cy="10" r="1.7"/></svg>
  </button>
  <button class="iconbtn" id="helpBtn" aria-label="help">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.9 2.9 0 015.5 1.2c0 2-2.7 2.4-2.7 4"/><circle cx="12" cy="17.2" r=".9" fill="currentColor" stroke="none"/></svg>
  </button>
  <button class="iconbtn" id="creditsBtn" aria-label="credits">
    <svg viewBox="0 0 24 24"><path d="M6 3.5h8l4.5 4.5v12.5H6z"/><path d="M14 3.5V8h4.5"/><path d="M9.2 12.5h5.6M9.2 16h3.8"/></svg>
  </button>
  <button class="iconbtn" id="homeBtn" aria-label="reset">
    <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
  </button>
</div>

<div id="nav"></div>

<div id="hud">
  <div class="hudrow">
    <button id="playBtn" aria-label="play"><svg id="playIco" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></button>
    <div class="slwrap">
      <div class="sllab"><span data-t="speed">Kecepatan waktu</span><i id="spdVal">10 hari/detik</i></div>
      <input type="range" id="spd" min="0" max="100" value="63">
    </div>
  </div>
  <div id="toggles">
    <button class="tg on" id="tgOrbit" data-t="tgOrbit">Garis orbit</button>
    <button class="tg on" id="tgLabel" data-t="tgLabel">Nama planet</button>
    <button class="tg on" id="tgBelt" data-t="tgBelt">Sabuk asteroid</button>
    <button class="tg on" id="tgMoon" data-t="tgMoon">Bulan</button>
    <button class="tg" id="tgTop" data-t="tgTop">Tampak atas</button>
  </div>
</div>

<div id="panel">
  <div id="phead">
    <button id="pclose" aria-label="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="ptype"></div>
    <div id="pname"></div>
    <div id="palt"></div>
    <button id="listenBtn"></button>
    <div id="voiceNote"></div>
  </div>
  <div id="pbody"></div>
</div>

<div id="cockpit">
  <div id="ckFrame"></div>
  <div id="ckGlass"></div>
  <div id="ckSheen"></div>
  <div class="ckMul l"></div>
  <div class="ckMul r"></div>
  <div id="ckCeil"></div>
  <div class="ckPillar l"><div class="ckBank"></div></div>
  <div class="ckPillar r"><div class="ckBank"></div></div>
  <div id="ckDash">
    <div class="ckBank"></div>
    <div class="scr"></div>
    <div class="scr"></div>
    <div class="ckBank"></div>
  </div>
  <div id="ckFlash"></div>
  <div id="ckCross"></div>
  <div id="ckDot"></div>
  <div id="ckWarn"></div>
  <div id="ckWreck"></div>
  <div id="ckHint"></div>

  <div class="ckPanel" id="ckSpeed">
    <div class="ckLab" id="ckSpdLab">Kecepatan</div>
    <div class="ckBig"><span id="ckSpdVal">0</span></div>
    <div class="ckSub" id="ckSpdSub"></div>
  </div>

  <div class="ckPanel" id="ckTarget">
    <div class="ckLab" id="ckTgtLab">Terdekat</div>
    <div class="ckBig" id="ckTgtName">—</div>
    <div class="ckSub" id="ckTgtDist"></div>
  </div>

  <div id="stickPad"><div id="stickKnob"></div></div>

  <div id="thrWrap">
    <div id="thrBar"><i id="thrFill"></i><div id="thrGrip"></div></div>
    <div id="thrVal">0%</div>
    <div id="thrLab">Dorongan</div>
  </div>

  <div id="ckBtns">
    <button class="ckb on" id="ckVoice" aria-label="voice">
      <svg viewBox="0 0 24 24"><path d="M4 9.4h3.3L11.6 6v12L7.3 14.6H4z"/><path d="M15 9.4a3.7 3.7 0 010 5.2"/><path d="M17.7 6.8a7.4 7.4 0 010 10.4"/></svg>
    </button>
    <button class="ckb on" id="ckEngine" aria-label="engine sound">
      <svg viewBox="0 0 24 24"><path d="M4 13.5v-3M8 16.5v-9M12 18.5v-13M16 15.5v-7M20 12.5v-1"/></svg>
    </button>
    <button class="ckb" id="ckFs" aria-label="fullscreen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4.5h4.6M20 9V4.5h-4.6M4 15v4.5h4.6M20 15v4.5h-4.6"/></svg>
    </button>

    <button class="ckb" id="ckExit">Keluar</button>

<div id="help"><div id="helpCard"></div></div>
<div id="credits"><div id="creditsCard"></div></div>

  <div id="langCard">

       You can switch any time with the ID / EN buttons at the top right.</p>
    <button class="lgBtn" data-l="id"><i>ID</i><span><b>Bahasa Indonesia</b><em>Lanjutkan dalam Bahasa Indonesia</em></span></button>
    <button class="lgBtn" data-l="en"><i>EN</i><span><b>English</b><em>Continue in English</em></span></button>
  </div>
</div>

<script>
/* Register the service worker: it makes the app installable and lets it open
   without a network. Only meaningful on https (or localhost), and a failure
   here must never stop the app from running. */
if('serviceWorker' in navigator &&
   (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>

<script>
/* If the 3D library fails to load (e.g. no internet connection), tell the user
   instead of leaving the loading screen spinning forever. */
setTimeout(function(){
  if(window.__dbg) return;
  var l = document.getElementById('loader');
  if(!l || l.classList.contains('done')) return;
  var id = (document.documentElement.lang||'id') !== 'en';
  document.getElementById('loadTxt').innerHTML = id
    ? 'Gagal memuat pustaka 3D.<br>Periksa koneksi internet lalu muat ulang halaman.'
    : 'Could not load the 3D library.<br>Check your internet connection and reload the page.';
  document.getElementById('loadTxt').style.cssText =
    'margin-top:26px;font-size:13px;line-height:1.6;text-align:center;letter-spacing:0;text-transform:none;color:#9aa6c7;max-width:280px';
  document.getElementById('barWrap').style.display = 'none';
}, 14000);
</script>
